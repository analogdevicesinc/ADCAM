name: Checkers for ADCAM

on:
  pull_request:
    branches:
        - main

permissions:
  contents: read

env:
  NUM_JOBS: 4

jobs:
  checkers:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Check cpp format
        if: always()
        uses: analogdevicesinc/shared-actions/check-cpp-format@main
        with:
          paths: ${{ github.workspace }}/apps ${{ github.workspace }}/sdk